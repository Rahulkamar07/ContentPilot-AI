name: Continuous Integration & Quality Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:v0.7.0-pg16
        env:
          POSTGRES_DB: contentpilot_db
          POSTGRES_USER: contentpilot_user
          POSTGRES_PASSWORD: SecureDbPassword123!
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U contentpilot_user -d contentpilot_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          cd backend
          ruff check .

      - name: Run Black Formatter Check
        run: |
          cd backend
          black --check .

      - name: Run Isort Import Order Check
        run: |
          cd backend
          isort --check-only .

      - name: Run Alembic Baseline Migration Check
        env:
          DATABASE_URL: postgresql+asyncpg://contentpilot_user:SecureDbPassword123!@localhost:5432/contentpilot_db
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://contentpilot_user:SecureDbPassword123!@localhost:5432/contentpilot_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          pytest

  frontend-lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      - name: Build Next.js Production Bundle
        run: |
          cd frontend
          npm run build
